<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mfsGlyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2FF3A"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="mfsGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D2FF3A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D2FF3A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dark obsidian squircle tile -->
  <rect x="0" y="0" width="64" height="64" rx="13.76" fill="#10131B"/>
  <!-- faint top sheen for depth -->
  <path d="M0 13.76 A13.76 13.76 0 0 1 13.76 0 H64 V35 H0 Z" fill="#FFFFFF" opacity="0.04"/>
  <!-- soft lime glow behind the glyph -->
  <circle cx="32" cy="32" r="19.2" fill="url(#mfsGlow)"/>

  <!-- neural-node glyph: a central node wired to three satellites -->
  <g stroke="url(#mfsGlyph)" stroke-width="2.56" stroke-linecap="round">
    <path d="M32 32 L32 16"/>
    <path d="M32 32 L18.14 40"/>
    <path d="M32 32 L45.86 40"/>
  </g>
  <g fill="url(#mfsGlyph)">
    <circle cx="32" cy="32" r="7.55"/>
    <circle cx="32" cy="16" r="4.6"/>
    <circle cx="18.14" cy="40" r="4.6"/>
    <circle cx="45.86" cy="40" r="4.6"/>
  </g>

  <!-- thin lime inner ring for a crisp modern edge -->
  <rect x="2.88" y="2.88" width="58.24" height="58.24" rx="11.84" fill="none"
        stroke="#D2FF3A" stroke-opacity="0.15" stroke-width="0.77"/>
</svg>
